Name: pms.rpc
ListenOn: 0.0.0.0:8082

postgresql:
  Datasource: host=127.0.0.1 user=root password=123456 dbname=gozero port=5432 sslmode=disable TimeZone=Asia/Shanghai

Rabbitmq:
  Host: 127.0.0.1
  Port: 5672
  UserName: root
  Password: "123456"
Mongo:
  Datasource: mongodb://admin:123456@127.0.0.1:27017
  Db: pms

Log:
  ServiceName: pms-service
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Path: logs/pms
Prometheus:
  Host: 127.0.0.1
  Port: 8182
  Path: /metrics

Redis:
  Host: 127.0.0.1:6379
  Type: "node"
  Pass: "123456"
  Tls: false
  Key: "pms:"